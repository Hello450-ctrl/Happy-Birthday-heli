<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Heli 🎂</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: black;
        color: white;
        text-align: center;
    }

    /* Start Screen */
    #startScreen {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #ff758c, #ff7eb3);
        cursor: pointer;
    }

    .cake {
        font-size: 100px;
        animation: bounce 1s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    #mainContent {
        display: none;
        padding-top: 80px;
    }

    h1 {
        font-size: 60px;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #fff; }
        to { text-shadow: 0 0 30px #ff69b4; }
    }

    p {
        font-size: 24px;
        width: 60%;
        margin: auto;
    }

    /* Balloons */
    .balloon {
        position: absolute;
        bottom: -150px;
        width: 60px;
        height: 80px;
        border-radius: 50%;
        animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
        from { transform: translateY(0); }
        to { transform: translateY(-120vh); }
    }

    /* Fireworks */
    .firework {
        position: absolute;
        width: 5px;
        height: 5px;
        background: white;
        border-radius: 50%;
        animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
        to {
            transform: scale(20);
            opacity: 0;
        }
    }
</style>

</head>
<body>

<!-- Start Screen -->

<div id="startScreen" onclick="startCelebration()">
    <div class="cake">🎂</div>
    <h2>Click to Celebrate 🎉</h2>
</div>

<!-- Main Content -->

<div id="mainContent">
    <h1>🎉 Happy Birthday Heli 🎉</h1>
    <p>
        To the most amazing girl 💖<br><br>
        May your day be filled with endless smiles, love, and beautiful moments.
        You deserve all the happiness in the world today and always ✨<br><br>
        Stay as sweet and wonderful as you are 🎂❤️
    </p>
</div>

<!-- Music -->

<audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b33b1.mp3" type="audio/mpeg">
</audio>

<script>
function startCelebration() {
    document.getElementById("startScreen").style.display = "none";

    // Play music
    document.getElementById("music").play();

    // Fireworks burst
    for (let i = 0; i < 40; i++) {
        let fw = document.createElement("div");
        fw.className = "firework";
        fw.style.left = Math.random() * window.innerWidth + "px";
        fw.style.top = Math.random() * window.innerHeight + "px";
        fw.style.background = "hsl(" + Math.random()*360 + ",100%,50%)";
        document.body.appendChild(fw);

        setTimeout(() => fw.remove(), 1000);
    }

    // Delay then show main content
    setTimeout(() => {
        document.getElementById("mainContent").style.display = "block";
    }, 1200);

    // Balloons
    setInterval(() => {
        let balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.style.left = Math.random() * window.innerWidth + "px";
        balloon.style.background = "hsl(" + Math.random()*360 + ",70%,60%)";
        document.body.appendChild(balloon);

        setTimeout(() => balloon.remove(), 8000);
    }, 500);
}
</script>

</body>
</html>
